[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Zwei App-Partitionen noetig fuer OTA-Updates (aktuell laufende + neu
; heruntergeladene, siehe ota_update.cpp). "min_spiffs.csv" (von Espressif
; mitgeliefert) gibt jeder der beiden App-Partitionen 0x1E0000 (1,875 MB)
; und schrumpft dafuer die SPIFFS-Partition auf nur noch 0x20000 (128 KB) -
; unproblematisch, da dieses Projekt den internen Flash-Speicher fuer Daten
; gar nicht nutzt (alles liegt auf der SD-Karte, siehe Config::SD_*). Bei
; aktuell ca. 1,25 MB Firmware-Groesse bleiben so noch reichlich ueber
; 600 KB Luft pro Partition. Vorher (bis v3.4.0) kam "no_ota.csv" zum
; Einsatz - eine einzige 2 MB grosse App-Partition ohne OTA-Faehigkeit, da
; OTA damals noch nicht existierte.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.1.0
    ricmoo/QRCode @ ^0.0.1
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=1000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1