[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No OTA (over-the-air firmware update) in use - always flashed via
; cable/web-flasher. The default partition scheme reserves two app
; partitions (~1.25 MB each) plus an unused SPIFFS data area (~1.375 MB) -
; over 2.5 MB of 4 MB flash wasted. "no_ota.csv" (shipped with the
; Espressif framework) uses a single, 2 MB app partition instead - doubles
; the space available for the actual firmware, no code changes needed.
board_build.partitions = no_ota.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.1.0
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=1000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1